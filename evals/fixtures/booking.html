<!doctype html><html lang="en"><meta charset="utf-8"><title>Appointment booking</title><main><h1>Book a visit</h1><form><label>Name <input name="name"></label><label>Date <input name="date" type="date"></label><label>Time <select name="time"><option>10:00</option><option>14:00</option></select></label><button type="submit">Confirm booking</button><output id="result"></output></form><script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#result').textContent='Booking confirmed'})</script></main></html>
