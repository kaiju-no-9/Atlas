<!doctype html><html lang="en"><meta charset="utf-8"><title>Products</title><main><h1>Products</h1><label for="sort">Sort by</label><select id="sort" onchange="{const l=document.querySelector('#items');[...l.children].sort((a,b)=>this.value==='asc'?+a.dataset.price-+b.dataset.price:+b.dataset.price-+a.dataset.price).forEach(x=>l.append(x))}"><option value="desc">Price: High to Low</option><option value="asc">Price: Low to High</option></select><ol id="items"><li data-price="30">Notebook — $30</li><li data-price="10">Pen — $10</li><li data-price="20">Folder — $20</li></ol></main></html>
